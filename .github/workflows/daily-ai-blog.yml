name: Daily AI Blog Generator (Dilipbhai)

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-style: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate AI Blog via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto_generate_blog.js

      - name: Commit and Push New Blog Post
        run: |
          git config --global user.name 'Dilipbhai AI Writer'
          git config --global user.email 'bot@shivamwatersolution.in'
          git add data/blogs_generated.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(blog): auto-publish daily SEO blog post by Dilipbhai" && git push)
